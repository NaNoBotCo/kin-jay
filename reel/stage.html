<script>
/* Kin Jay, 45 seconds, 1080 × 1920. stage.render(t) draws frame t; render.mjs steps it. Beats sit on a
   120 bpm grid (0.5 s) so the drums in audio.py land on the cuts. */
(function () {
"use strict";
var cv = document.getElementById("cv"), c = cv.getContext("2d"), W = 1080, H = 1920, TAU = Math.PI * 2;
var K = window.JAYKIT, D = window.JAYDOODLE, YEL = "#ffd21f", RED = "#c8102e", DEEP = "#5c0a14", INK = "#2b1a10";
D.setMap(REEL.map);
var IMG = {};
["steamed-buns", "veg-pork-sign", "soy-protein", "parade-phuket", "firecrackers-2011", "krabi-sedan", "che-sign", "cherngtalay-shrine", "ma-song"].forEach(function (k) {
  var i = new Image(); i.src = "../docs/img/" + k + ".jpg"; IMG[k] = i;

var CREDIT = {
  "steamed-buns": "ภาพ Kirill Kay · CC BY-SA 3.0 · Wikimedia Commons", "veg-pork-sign": "ภาพ Dahlfred · CC BY-SA 3.0 · Wikimedia Commons",
  "soy-protein": "ภาพ ศีลงูสาวสวยปาแหวน · CC BY-SA 3.0 · Wikimedia Commons", "parade-phuket": "ภาพ Kirill Kay · CC BY-SA 3.0 · Wikimedia Commons",
  "firecrackers-2011": "ภาพ Joseph Ferris III · CC BY 2.0 · Wikimedia Commons", "krabi-sedan": "ภาพ OraMAAG · CC BY 4.0 · Wikimedia Commons",
  "che-sign": "ภาพ Pawyilee · สาธารณสมบัติ · Wikimedia Commons", "cherngtalay-shrine": "ภาพ Kirill Kay · CC BY-SA 3.0 · Wikimedia Commons",
  "ma-song": "ภาพ Kirill Kay · CC BY-SA 3.0 · Wikimedia Commons"

/* ---------- helpers ---------- */
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function k01(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function easeOut(u) { return 1 - Math.pow(1 - u, 3); }
function back(u) { var s = 1.9; u = clamp(u, 0, 1) - 1; return u * u * ((s + 1) * u + s) + 1; }
function pop(t, at, d) { return back(k01(t, at, at + (d || 0.35))); }
function rnd(seed) { var s = seed >>> 0 || 1; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
var HITS = [];   // [time, strength] screen shakes
function shake(t) {
  var x = 0, y = 0;
  HITS.forEach(function (h) { var d = t - h[0]; if (d >= 0 && d < 0.35) { var a = h[1] * (1 - d / 0.35); x += Math.sin(d * 90) * a; y += Math.cos(d * 70) * a; } });
  return [x, y];
}
function cap(th, en, y, t, at, o) {          // a caption that pops in: Thai big, English under
  o = o || {}; var s = pop(t, at, 0.3); if (s <= 0) return;
  var size = o.size || 104, col = o.col || "#fff8e6", stroke = o.stroke || "#2a0508";
  var wob = (1 - k01(t, at, at + 0.45)) * Math.sin((t - at) * 30) * 0.07 * (o.wob == null ? 1 : o.wob);
  c.save(); c.translate(W / 2, y); c.scale(s, s); c.rotate(wob); c.textAlign = "center"; c.textBaseline = "middle";
  c.lineJoin = "round";
  c.font = "900 " + size + "px 'Noto Sans Thai'";
  c.shadowColor = o.glow || "rgba(0,0,0,.45)"; c.shadowBlur = o.glow ? size * 0.5 : size * 0.12; c.shadowOffsetY = o.glow ? 0 : size * 0.06;
  c.lineWidth = size * 0.16; c.strokeStyle = stroke; c.strokeText(th, 0, 0);
  c.shadowColor = "transparent"; c.fillStyle = col; c.fillText(th, 0, 0);
  if (en) { var es = o.esize || Math.round(size * 0.46); c.font = "800 " + es + "px 'Noto Sans Thai'"; c.lineWidth = es * 0.2; c.strokeText(en, 0, size * 0.78); c.fillStyle = o.ecol || YEL; c.fillText(en, 0, size * 0.78); }
  c.restore();
}
function credit(s) { c.save(); c.font = "600 26px 'Noto Sans Thai'"; c.fillStyle = "rgba(255,255,255,.85)"; c.textAlign = "center"; c.shadowColor = "#000"; c.shadowBlur = 6; c.fillText(s, W / 2, H - 60); c.restore(); }
function photo(img, t, at, dur, zoom) {      // Ken Burns, cover-fit
  if (!img.complete || !img.naturalWidth) return;
  var u = k01(t, at, at + dur), z = 1.08 + (zoom || 0.14) * u, iw = img.naturalWidth, ih = img.naturalHeight;
  var s = Math.max(W / iw, H / ih) * z, dw = iw * s, dh = ih * s;
  c.drawImage(img, (W - dw) / 2 - (zoom > 0 ? 30 : -30) * u, (H - dh) / 2, dw, dh);
  var g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "rgba(0,0,0,.45)"); g.addColorStop(0.35, "rgba(0,0,0,0)"); g.addColorStop(0.7, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.6)");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}
function bunting(t, y0, sag, n, size, drop) {   // a string of 齋 / เจ pennants, dropping in
  var dy = drop == null ? 0 : (1 - back(drop)) * -500;
  c.save(); c.translate(0, dy);
  c.strokeStyle = "rgba(255,230,190,.7)"; c.lineWidth = 3; c.beginPath();
  for (var x = 0; x <= W; x += 20) { var u = x / W, yy = y0 + sag * 4 * u * (1 - u); if (x) c.lineTo(x, yy); else c.moveTo(x, yy); } c.stroke();
  for (var i = 0; i < n; i++) {
    var x2 = (i + 0.5) * W / n, u2 = x2 / W, y2 = y0 + sag * 4 * u2 * (1 - u2), a = 0.16 * Math.sin(t * 3 + i * 1.3) + 0.06 * Math.sin(t * 7 + i);
    K.pennant(c, x2, y2, size, size * 1.25, a, 0, i % 2 ? "เจ" : "齋");
  }
  c.restore();
}
function bgRed() { var g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#3a0710"); g.addColorStop(0.6, "#7d1420"); g.addColorStop(1, "#d8641c"); c.fillStyle = g; c.fillRect(0, 0, W, H); }
function bgPaper(seed) { D.paper(c, W, H, seed || 3); }
function stamp(t, at, draw) {                  // something slammed onto the frame: 3× → 1×
  var u = k01(t, at, at + 0.22); if (t < at) return;
  var s = 1 + 2 * (1 - easeOut(u)), a = u;
  c.save(); c.globalAlpha = a; c.translate(W / 2, H / 2); c.scale(s, s); c.translate(-W / 2, -H / 2); draw(); c.restore();
}
function garlic(x, y, s) {
  D.shape(c, [[x - s, y], [x - s * 0.9, y - s * 0.8], [x - s * 0.2, y - s * 1.2], [x, y - s * 1.9], [x + s * 0.2, y - s * 1.2], [x + s * 0.9, y - s * 0.8], [x + s, y], [x, y + s * 0.3]], "#f6efe0", 3, 4);
  D.ink(c, [[x, y - s * 1.2], [x, y + s * 0.2]], { seed: 4, w: 3 });
  D.ink(c, [[x - s * 0.5, y - s * 0.9], [x - s * 0.4, y + s * 0.1]], { seed: 5, w: 3 }); D.ink(c, [[x + s * 0.5, y - s * 0.9], [x + s * 0.4, y + s * 0.1]], { seed: 6, w: 3 });
}
function bigX(x, y, s, t, at) {
  var u = k01(t, at, at + 0.18); if (u <= 0) return;
  c.save(); c.globalAlpha = 0.92; c.strokeStyle = RED; c.lineWidth = s * 0.16; c.lineCap = "round";
  c.beginPath(); c.moveTo(x - s, y - s); c.lineTo(x - s + 2 * s * u, y - s + 2 * s * u); c.stroke();
  if (u > 0.5) { var v = (u - 0.5) * 2; c.beginPath(); c.moveTo(x + s, y - s); c.lineTo(x + s - 2 * s * v, y - s + 2 * s * v); c.stroke(); }
  c.restore();
}
function tick(x, y, s, t, at) {
  var u = k01(t, at, at + 0.18); if (u <= 0) return;
  c.save(); c.strokeStyle = "#2f9a4a"; c.lineWidth = s * 0.18; c.lineCap = c.lineJoin = "round"; c.beginPath();
  c.moveTo(x - s, y); c.lineTo(x - s * 0.3, y + s * 0.7 * Math.min(1, u * 2)); if (u > 0.5) c.lineTo(x - s * 0.3 + s * 1.3 * (u - 0.5) * 2, y + s * 0.7 - s * 1.5 * (u - 0.5) * 2); c.stroke(); c.restore();
}

/* ---------- fx: sparks, confetti, fireworks, rays, embers. Each is a function of t, so any frame renders alone ---------- */
var BURSTS = [], LIGHT = false;   // LIGHT: a paper background, where glow is painted rather than added
function burst(at, x, y, kind, n, sp, cols) { BURSTS.push({ at: at, x: x, y: y, kind: kind, n: n || 60, sp: sp || 900, cols: cols, seed: (at * 977 + x * 13 + y) | 0 }); }
var LIFE = { spark: 0.9, fire: 1.7, confetti: 2.4 };
function drift(v, d, k, vt) { var f = (1 - Math.exp(-k * d)) / k; return (v - vt) * f + vt * d; }   // linear drag, terminal speed vt
function drawBursts(t) {
  BURSTS.forEach(function (b) {
    var d = t - b.at, life = LIFE[b.kind]; if (d < 0 || d > life) return;
    var R = rnd(b.seed), cols = b.cols || (LIGHT ? [RED, "#ff8a00", "#e8b400", DEEP] : [YEL, "#ff9a2a", "#fff3c4", "#ff4a3a"]), fade = 1 - d / life, ADD = LIGHT ? "source-over" : "lighter";
    c.save();
    if (d < 0.22 && b.kind !== "confetti") {      // the flash at the source
      var fr = (b.kind === "fire" ? 340 : 220) * (0.4 + d / 0.22), fa = 0.9 * (1 - d / 0.22);
      var g = c.createRadialGradient(b.x, b.y, 0, b.x, b.y, fr); g.addColorStop(0, "rgba(255,250,220," + fa + ")"); g.addColorStop(0.35, "rgba(255,190,60," + fa * 0.5 + ")"); g.addColorStop(1, "rgba(255,120,40,0)");
      c.globalCompositeOperation = ADD; c.fillStyle = g; c.fillRect(b.x - fr, b.y - fr, fr * 2, fr * 2);
    }
    for (var i = 0; i < b.n; i++) {
      var a = R() * TAU, v = b.sp * (0.3 + 0.7 * R()), col = cols[i % cols.length], ph = R() * TAU, sz = 0.6 + R() * 0.8;
      if (b.kind === "confetti") {
        a = -Math.PI / 2 + (R() - 0.5) * 2.4;
        var vx = Math.cos(a) * v, vy = Math.sin(a) * v;
        var x = b.x + drift(vx, d, 2.4, 0) + Math.sin(d * 4 + ph) * 36, y = b.y + drift(vy, d, 2.4, 340);
        c.globalCompositeOperation = "source-over"; c.globalAlpha = Math.min(1, fade * 3);
        c.save(); c.translate(x, y); c.rotate(ph + d * 6); c.scale(1, Math.cos(d * 11 + ph));
        c.fillStyle = col; c.fillRect(-14 * sz, -8 * sz, 28 * sz, 16 * sz); c.restore();
        continue;
      }
      var k = b.kind === "fire" ? 1.6 : 3.2, vt = b.kind === "fire" ? 160 : 620, tail = b.kind === "fire" ? 0.14 : 0.05;
      var ca = Math.cos(a) * v, sa = Math.sin(a) * v, d0 = Math.max(0, d - tail);
      var x1 = b.x + drift(ca, d, k, 0), y1 = b.y + drift(sa, d, k, vt), x0 = b.x + drift(ca, d0, k, 0), y0 = b.y + drift(sa, d0, k, vt);
      var tw = b.kind === "fire" && d > 0.9 ? 0.5 + 0.5 * Math.sin(d * 40 + ph) : 1;
      c.globalCompositeOperation = ADD; c.lineCap = "round"; c.strokeStyle = col;
      c.globalAlpha = 0.28 * fade * tw; c.lineWidth = 16 * sz * fade + 3; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      c.globalAlpha = fade * tw; c.lineWidth = 5 * sz * fade + 1.5; c.strokeStyle = i % 3 ? col : "#fffbe8"; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
    }
    c.restore();
  });
}
function embers(t, n, rgb, alpha, seed) {        // glowing flecks rising through the frame
  var R = rnd(seed || 77); c.save(); c.globalCompositeOperation = "lighter";
  for (var i = 0; i < n; i++) {
    var x0 = R() * W, sp = 70 + R() * 190, ph = R() * TAU, sz = 2 + R() * 5, off = R() * (H + 200);
    var y = H + 100 - ((t * sp + off) % (H + 200)), x = x0 + Math.sin(t * 1.4 + ph) * 46, a = alpha * (0.55 + 0.45 * Math.sin(t * 7 + ph));
    c.fillStyle = "rgba(" + rgb + "," + a * 0.22 + ")"; c.beginPath(); c.arc(x, y, sz * 3.2, 0, TAU); c.fill();
    c.fillStyle = "rgba(" + rgb + "," + a + ")"; c.beginPath(); c.arc(x, y, sz, 0, TAU); c.fill();
  }
  c.restore();
}
function rays(x, y, t, rgb, a, r, n) {           // a slow sunburst behind a big word
  if (a <= 0) return;
  if (LIGHT) a = Math.min(1, a * 1.6);
  n = n || 16; c.save(); c.translate(x, y); c.rotate(t * 0.4); c.globalCompositeOperation = LIGHT ? "source-over" : "lighter";
  var g = c.createRadialGradient(0, 0, 0, 0, 0, r); g.addColorStop(0, "rgba(" + rgb + "," + a + ")"); g.addColorStop(0.6, "rgba(" + rgb + "," + a * 0.35 + ")"); g.addColorStop(1, "rgba(" + rgb + ",0)");
  c.fillStyle = g; c.beginPath();
  for (var i = 0; i < n; i++) { var a0 = i / n * TAU; c.moveTo(0, 0); c.arc(0, 0, r, a0, a0 + TAU / n * 0.5); c.closePath(); }
  c.fill(); c.restore();

function glowBall(x, y, r, rgb, a) {
  c.save(); c.globalCompositeOperation = LIGHT ? "source-over" : "lighter";
  var g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, "rgba(" + rgb + "," + a + ")"); g.addColorStop(1, "rgba(" + rgb + ",0)");
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); c.restore();
}
function vignette(a) {
  var g = c.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.72); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0," + a + ")");
  c.fillStyle = g; c.fillRect(0, 0, W, H);

function wipe(t, at) {                           // yellow-and-red flag stripes sweep across a cut
  var d = t - at; if (d < -0.16 || d > 0.2) return;
  var u = d < 0 ? 1 + d / 0.16 : d / 0.2;        // 0 → 1 coming in, then 0 → 1 going out
  var off = d < 0 ? -W * 2.4 * (1 - easeOut(u)) : W * 2.4 * u * u;

  c.restore();

/* ---------- the beats ---------- */
var SEC = [
  [0, 3.5, hook], [3.5, 8, flag], [8, 15.5, wok], [15.5, 21.5, menu], [21.5, 31, festival], [31, 37, legend], [37, 41.5, north], [41.5, 45, end]
];
// shakes on the big hits (audio.py puts drums and stamps on the same times)
HITS.push([0.0, 16], [1.2, 12], [1.5, 30], [2.0, 22], [4.2, 26], [5.6, 26], [11.5, 34], [12.5, 14], [13.0, 14], [13.5, 14], [27.5, 14], [28.5, 16], [33.5, 20], [41.5, 18], [44.5, 22]);
// sparks, confetti and fireworks (audio.py puts a crack, a pop or a boom under each)
burst(0.0, 180, 720, "spark", 70, 1300); burst(0.1, 900, 560, "spark", 70, 1300); burst(0.24, 300, 1560, "spark", 50, 1000); burst(0.38, 830, 1680, "spark", 50, 1000);
burst(0.55, 540, 1250, "fire", 90, 1100);
burst(1.2, 540, 1980, "confetti", 150, 2700);
burst(1.5, 540, 1040, "spark", 80, 1500, ["#ff3b3b", YEL, "#ffffff"]);
burst(2.0, 540, 600, "fire", 110, 1300);
burst(4.2, 290, 1030, "confetti", 60, 1500); burst(5.6, 790, 1030, "confetti", 60, 1500);
burst(11.55, 540, 330, "spark", 80, 1400, [RED, "#ff6a00", DEEP]); burst(14.0, 540, 400, "spark", 50, 1100);
[19.4, 19.8, 20.2].forEach(function (at, i) { burst(at, 540, 480 + i * 470, "confetti", 34, 900); });
burst(26.55, 540, 1400, "spark", 50, 1100);
(function () { var R = rnd(2011); for (var k = 0; k < 10; k++) burst(27.5 + k * 0.1, 140 + R() * 800, 260 + R() * 1000, "spark", 40, 1100); })();
burst(28.55, 540, 520, "fire", 90, 1200);
burst(29.5, 90, 1980, "confetti", 90, 2500); burst(29.55, 990, 1980, "confetti", 90, 2500);
burst(33.5, 294, 746, "fire", 60, 700, ["#ff9ab0", "#ffd6e0", "#ffffff"]); burst(33.55, 103, 1147, "fire", 60, 700, ["#ff9ab0", "#ffd6e0", "#ffffff"]);
var FIREWORKS = [[41.55, 540, 700, 1500], [42.2, 250, 470, 1000], [42.7, 830, 430, 1000], [43.2, 300, 1000, 900], [43.7, 800, 980, 900], [44.15, 540, 380, 1200]];
FIREWORKS.forEach(function (f, i) { burst(f[0], f[1], f[2], "fire", 100, f[3], [[YEL, "#fff3c4", "#ff9a2a"], ["#ff5a7a", "#ffd0dc", "#fff"], [YEL, "#ffffff"], ["#7affc8", "#fff", YEL], ["#ff9a2a", "#fff3c4"], [YEL, "#ff4a3a", "#fff"]][i]); });
burst(44.5, 540, 1980, "confetti", 180, 2800);
var WIPES = [3.5, 8, 15.5, 21.5, 37, 41.5], FLASHES = [1.2, 19.4, 26.5, 29.5, 31];

function hook(t) {
  if (t < 1.2) {
    c.fillStyle = "#000"; c.fillRect(0, 0, W, H);
    var pz = 1 + 0.35 * Math.pow(1 - k01(t, 0, 0.5), 3);            // the photo slams in from close
    c.save(); c.translate(W / 2, H / 2); c.scale(pz, pz); c.translate(-W / 2, -H / 2); photo(IMG["parade-phuket"], t, 0, 1.2, 0.25); c.restore();
    var fl = 0.45 * Math.max(0, Math.sin(t * 40)) * (1 - k01(t, 0, 0.8));  // firecracker flicker
    c.fillStyle = "rgba(255,200,120," + fl * 0.5 + ")"; c.fillRect(0, 0, W, H);
    rays(W / 2, 1250, t, "255,200,60", 0.55 * k01(t, 0.55, 0.75), 900);
    drawBursts(t);
    cap("ทั้งเมืองใส่ชุดขาว", "A whole town in white.", 300, t, 0.05, { size: 112 });
    cap("ทำไม?", "Why?", 1250, t, 0.55, { size: 220, col: YEL, glow: "rgba(255,150,0,.9)" });
    credit(CREDIT["parade-phuket"]);
    return;
  }
  bgRed();
  rays(W / 2, 1060, t, "255,170,40", 0.32, 1300, 20);
  embers(t, 40, "255,190,80", 0.8, 3);
  bunting(t, 120, 70, 9, 96, k01(t, 1.2, 1.6));
  bunting(t, 330, 80, 11, 78, k01(t, 1.4, 1.8));
  var s0 = pop(t, 1.2, 0.25); c.save(); c.translate(W / 2, 1080); c.scale(s0 * 1.8, s0 * 1.8); garlic(0, 60, 95); c.restore();
  bigX(W / 2, 1040, 250, t, 1.5);
  drawBursts(t);
  cap("9 วัน", "", 600, t, 2.0, { size: 260, col: YEL, glow: "rgba(255,140,0,.95)" });
  cap("ไม่มีกระเทียม", "9 days. Zero garlic.", 1420, t, 2.5, { size: 124 });
}
function flag(t) {
  LIGHT = true;
  bgPaper(7);
  [[290, 3.95], [790, 5.35]].forEach(function (f) { if (t > f[1]) rays(f[0], 760, t, "255,190,40", 0.4 * k01(t, f[1], f[1] + 0.3), 560, 14); });
  function oneFlag(x, ch, at) {
    var u = pop(t, at, 0.3); if (u <= 0) return;
    c.save(); c.translate(x, 760 - 900 * (1 - easeOut(k01(t, at, at + 0.25)))); c.rotate(Math.sin(t * 2.5 + x) * 0.03 + (1 - k01(t, at, at + 0.5)) * Math.sin((t - at) * 28) * 0.12);
    c.fillStyle = YEL; c.strokeStyle = RED; c.lineWidth = 12;
    c.fillRect(-190, -260, 380, 520); c.strokeRect(-190, -260, 380, 520);
    if (t > at + 0.25) { c.fillStyle = RED; K.letter(c, ch, 0, 0, 330 * pop(t, at + 0.25, 0.2)); }
    c.restore();
  }
  oneFlag(290, "齋", 3.7);
  oneFlag(790, "เจ", 5.1);
